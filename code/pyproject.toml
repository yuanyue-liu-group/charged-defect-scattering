[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "potcorr"
version = "0.1.0"
description = "Descreening and rescreening of charged-defect potentials from DFT supercells"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Rongjing Guo" }]
keywords = ["dft", "charged defect", "dielectric screening", "carrier mobility", "2d materials"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "scipy",
    "h5py",
]

[project.optional-dependencies]
mpi = ["mpi4py"]
notebooks = ["jupyter", "matplotlib"]

[project.urls]
Method = "https://github.com/yuanyue-liu-group/charged-defect-scattering"

[tool.setuptools]
packages = ["potcorr"]
